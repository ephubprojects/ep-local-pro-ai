<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EP HUB Channel</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EP HUB Channel" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="/css/wt.css?v=19" />
  <style>
    .ch-feed {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .ch-bubble {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }
    .ch-bubble.mine   { align-self: flex-end;  background: #2563eb; color: #fff; }
    .ch-bubble.theirs { align-self: flex-start; background: #374151; color: #e5e7eb; }
    .ch-bubble-from   { font-size: 11px; font-weight: 600; margin-bottom: 3px; opacity: 0.7; }
    .ch-img           { max-width: 100%; border-radius: 8px; display: block; cursor: pointer; }
    .ch-link          { color: #93c5fd; text-decoration: underline; word-break: break-all; }
    .ch-bubble.mine .ch-link { color: #bfdbfe; }
    .ch-attach-bar {
      display: flex;
      gap: 8px;
      padding: 6px 12px 2px;
      flex-shrink: 0;
    }
    .ch-attach-btn {
      background: #374151;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 18px;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
    }
    .ch-file-input { display: none; }
    .ch-link-row {
      display: flex;
      gap: 6px;
      padding: 2px 12px 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .ch-link-row.hidden { display: none; }
    .ch-link-input {
      flex: 1;
      min-width: 120px;
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-size: 13px;
    }
    .ch-link-input::placeholder { color: #9ca3af; }
    .ch-link-send-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="wtApp">

  <!-- Loading -->
  <div id="chLoading" class="wt-screen">
    <div class="wt-logo">EP HUB Channel</div>
    <div class="wt-loading-spinner"><div class="wt-spinner"></div></div>
    <p>Connecting…</p>
  </div>

  <!-- Error -->
  <div id="chError" class="wt-screen hidden">
    <div class="wt-logo">EP HUB Channel</div>
    <div class="wt-error-icon">⚠️</div>
    <h2 id="chErrorTitle">Connection Failed</h2>
    <p id="chErrorMsg">Invalid or expired link. Ask your organizer for a new link.</p>
  </div>

  <!-- Main -->
  <div id="chMain" class="wt-screen hidden">

    <!-- Top bar: channel name + identity -->
    <header class="wt-topbar">
      <div class="wt-topbar-info">
        <div class="wt-biz-name" id="chChannelName">Loading…</div>
        <div class="wt-channel-badge">📡 EP HUB Channel</div>
      </div>
      <div class="wt-me-pill">
        <span class="wt-me-role" id="chRole">Role</span>
        <span class="wt-me-name" id="chNameBadge">Name</span>
      </div>
    </header>

    <!-- Online presence bar -->
    <div class="wt-online-bar">
      <span class="wt-online-dot"></span>
      <span id="chOnlineText">Loading…</span>
    </div>

    <!-- Channel / contacts selector -->
    <div class="wt-contacts" id="chContacts">
      <button class="wt-contacts-toggle" id="chContactsToggle" aria-label="Select contact">
        <span class="wt-contacts-label">SEND TO</span>
        <span class="wt-contacts-current" id="chContactsCurrent">📡 All Users</span>
        <span class="wt-contacts-arrow" id="chContactsArrow">▼</span>
      </button>
      <div class="wt-contact-list" id="chContactList"></div>
    </div>

    <!-- Message feed -->
    <div class="ch-feed" id="chFeed"></div>

    <!-- Attachment bar -->
    <div class="ch-attach-bar">
      <label class="ch-attach-btn" title="Send image">
        📷 <input type="file" id="chImgInput" accept="image/*" class="ch-file-input">
      </label>
      <button class="ch-attach-btn" id="chLinkToggle" title="Send link">🔗</button>
    </div>
    <div class="ch-link-row hidden" id="chLinkRow">
      <input type="url"  id="chLinkUrl"  class="ch-link-input" placeholder="https://…">
      <input type="text" id="chLinkText" class="ch-link-input" placeholder="Label (optional)">
      <button id="chLinkSend" class="ch-link-send-btn">Send</button>
    </div>

    <!-- PTT zone -->
    <div class="wt-ptt-zone">
      <div class="wt-ptt-hint" id="chPttHint">Release to send to all users</div>
      <div class="wt-ptt-wrap">
        <button class="wt-ptt-btn" id="chPttBtn" aria-label="Hold to talk">
          <span class="wt-ptt-icon">🎙️</span>
          <span class="wt-ptt-label">Hold to Talk</span>
        </button>
      </div>
    </div>

    <!-- Audio playing indicator (floats above PTT) -->
    <div class="wt-audio-indicator hidden" id="chAudioIndicator">
      <span>🔊</span> <span id="chAudioFrom">User</span> is talking…
    </div>

  </div>
</div>

<script type="module" src="/js/channel.js?v=4"></script>
</body>
</html>
